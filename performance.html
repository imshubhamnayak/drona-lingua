<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress - Drona Lingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
        .progress-bar { transition: width 1s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <div class="max-w-2xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='index.html'" 
                    class="flex items-center gap-2 text-slate-400 hover:text-white">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Practice
            </button>
            <h1 class="text-3xl font-bold">Your Progress</h1>
        </div>

        <div id="progress-content" class="space-y-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900 rounded-3xl p-6 text-center">
                    <div class="text-5xl font-bold text-orange-400" id="stat-score">0</div>
                    <div class="text-slate-400 mt-1">Total Score</div>
                </div>
                <div class="bg-slate-900 rounded-3xl p-6 text-center">
                    <div class="text-5xl font-bold text-emerald-400" id="stat-streak">0</div>
                    <div class="text-slate-400 mt-1">Day Streak 🔥</div>
                </div>
            </div>

            <div class="bg-slate-900 rounded-3xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <div class="font-medium">Level <span id="stat-level" class="text-orange-400 font-bold">1</span></div>
                    <div class="text-sm text-slate-400" id="stat-words">0 words practiced</div>
                </div>
                <div class="h-3 bg-slate-800 rounded-full overflow-hidden">
                    <div id="level-progress" class="h-3 bg-gradient-to-r from-orange-500 to-amber-500 progress-bar w-1/5"></div>
                </div>
            </div>

            <!-- Module Progress -->
            <div>
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> Module Progress
                </h2>
                <div id="module-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        function loadProgress() {
            const username = localStorage.getItem('dronaUsername') || "Guest";
            const progress = JSON.parse(localStorage.getItem('dronaLinguaProgress') || '{}');

            document.getElementById('stat-score').textContent = progress.score || 0;
            document.getElementById('stat-streak').textContent = progress.streak || 0;
            document.getElementById('stat-level').textContent = progress.level || 1;
            document.getElementById('stat-words').textContent = `${progress.totalWordsPracticed || 0} words practiced`;

            // Level progress (simple 20% per level for demo)
            const levelProgress = Math.min(((progress.level || 1) - 1) * 20 + 10, 100);
            document.getElementById('level-progress').style.width = `${levelProgress}%`;

            // Mock module progress (you can make this dynamic later)
            const moduleList = document.getElementById('module-list');
            moduleList.innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-4 flex justify-between items-center">
                    <div>Module 1-5: Basic Sounds</div>
                    <div class="text-emerald-400">Completed</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 flex justify-between items-center">
                    <div>Module 6-10: Minimal Pairs</div>
                    <div class="text-orange-400">In Progress</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 flex justify-between items-center opacity-60">
                    <div>Module 11-20: Advanced Sentences</div>
                    <div>Locked</div>
                </div>
            `;
        }

        window.onload = loadProgress;
    </script>
</body>
</html>
