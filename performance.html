<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Dashboard • Drona Lingua</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1c; color: #e2e8f0; margin: 0; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; background: #1e2937; border-radius: 12px; overflow: hidden; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #111827; font-weight: 600; }
    tr:hover { background: #334155; }
    .progress-bar { background: #334155; border-radius: 9999px; height: 8px; width: 120px; overflow: hidden; }
    .progress-fill { background: #22c55e; height: 100%; }
    .badge { padding: 2px 10px; border-radius: 9999px; font-size: 13px; }
    .badge-green { background: #166534; color: #86efac; }
  </style>
</head>
<body>

  <h1>📊 Drona Lingua - Performance Dashboard</h1>

  <table id="performanceTable">
    <thead>
      <tr>
        <th>Username</th>
        <th>Level</th>
        <th>XP</th>
        <th>Modules Completed</th>
        <th>Time Spent</th>
        <th>Last Practiced</th>
      </tr>
    </thead>
    <tbody>
      <!-- Data will be loaded here by JavaScript -->
    </tbody>
  </table>

  <script>
    const API_URL = "https://drona-lingua-backend.onrender.com";

    async function loadPerformance() {
      try {
        const res = await fetch(`${API_URL}/api/users`);
        const users = await res.json();

        const tbody = document.querySelector("#performanceTable tbody");
        tbody.innerHTML = "";

        users.forEach(user => {
          const completed = user.completed_modules ? user.completed_modules.length : 0;
          const progress = Math.round((completed / 20) * 100);

          // Format time spent
          let timeHtml = "No data";
          if (user.time_spent && Object.keys(user.time_spent).length > 0) {
            timeHtml = "";
            Object.keys(user.time_spent).forEach(modId => {
              const secs = user.time_spent[modId];
              const min = Math.floor(secs / 60);
              timeHtml += `M${modId}: ${min}m<br>`;
            });
          }

          const lastPracticed = user.last_practiced 
            ? new Date(user.last_practiced).toLocaleString() 
            : "Never";

          const row = `
            <tr>
              <td><strong>${user.username}</strong></td>
              <td><span class="badge badge-green">Level ${user.level}</span></td>
              <td>${user.xp} XP</td>
              <td>
                ${completed}/20
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
              </td>
              <td style="font-size: 13px; line-height: 1.4;">${timeHtml}</td>
              <td style="font-size: 13px;">${lastPracticed}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });

      } catch (error) {
        console.error("Error loading performance:", error);
        alert("Failed to load performance data. Please try again later.");
      }
    }

    // Load data when page opens
    loadPerformance();
  </script>
</body>
</html>
