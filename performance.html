<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Performance Dashboard • Drona Lingua</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1c; color: #e2e8f0; padding: 20px; }
    table { width: 100%; border-collapse: collapse; background: #1e2937; border-radius: 12px; overflow: hidden; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #111827; }
  </style>
</head>
<body>
  <h1>📊 Drona Lingua - Performance Dashboard</h1>
  <button onclick="loadPerformance()">Refresh</button>
  <br><br>
  <table id="perfTable">
    <thead>
      <tr>
        <th>Username</th>
        <th>Level</th>
        <th>XP</th>
        <th>Modules Completed</th>
        <th>Last Practiced</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API_URL = "https://drona-lingua-backend.onrender.com";

    async function loadPerformance() {
      const tbody = document.querySelector("#perfTable tbody");
      tbody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";

      try {
        const res = await fetch(`${API_URL}/api/users`);
        const users = await res.json();

        tbody.innerHTML = "";

        if (users.length === 0) {
          tbody.innerHTML = "<tr><td colspan='5'>No users found yet.</td></tr>";
          return;
        }

        users.forEach(user => {
          const completed = user.completed_modules ? user.completed_modules.length : 0;
          const last = user.last_practiced ? new Date(user.last_practiced).toLocaleString() : "Never";

          const row = `
            <tr>
              <td><strong>${user.username}</strong></td>
              <td>Level ${user.level}</td>
              <td>${user.xp} XP</td>
              <td>${completed} / 20</td>
              <td>${last}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (err) {
        tbody.innerHTML = "<tr><td colspan='5' style='color:red'>Failed to load data. Check backend.</td></tr>";
      }
    }

    loadPerformance();
  </script>
</body>
</html>
