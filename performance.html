<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance • Drona Lingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-5xl mx-auto p-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold">Your Learning Performance</h1>
                <p class="text-slate-400" id="performance-user"></p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-2xl text-sm">
                ← Back to Modules
            </a>
        </div>

        <!-- Overall Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
                <div class="text-sm text-slate-400">Total Words Practiced</div>
                <div class="text-4xl font-bold mt-2" id="total-practiced">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
                <div class="text-sm text-slate-400">Modules Started</div>
                <div class="text-4xl font-bold mt-2" id="modules-started">0</div>
            </div>
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
                <div class="text-sm text-slate-400">Average Score</div>
                <div class="text-4xl font-bold mt-2" id="average-score">0</div>
            </div>
        </div>

        <!-- Module-wise Progress -->
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
            <h3 class="font-semibold mb-4">Module Progress</h3>
            <div id="module-progress-list" class="space-y-4">
                <!-- Populated by JavaScript -->
            </div>
        </div>

    </div>

    <script>
        const BACKEND_URL = "https://drona-lingua.onrender.com";

        async function loadPerformance() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('user');

            if (!username) {
                document.body.innerHTML = `<div class="p-10 text-center">No user found. Please login first.</div>`;
                return;
            }

            document.getElementById('performance-user').innerText = `Progress for: ${username}`;

            try {
                const res = await fetch(`${BACKEND_URL}/get-progress/${username}`);
                if (!res.ok) {
                    document.getElementById('module-progress-list').innerHTML = 
                        `<p class="text-slate-400">No progress found yet. Start practicing!</p>`;
                    return;
                }

                const data = await res.json();

                // Overall Stats
                document.getElementById('total-practiced').innerText = data.totalPracticed || 0;

                const modulesStarted = Object.keys(data.modules || {}).length;
                document.getElementById('modules-started').innerText = modulesStarted;

                // Calculate average score
                let totalScore = 0;
                let count = 0;
                Object.values(data.modules || {}).forEach(mod => {
                    if (mod.score) {
                        totalScore += mod.score;
                        count++;
                    }
                });
                const avgScore = count > 0 ? Math.round(totalScore / count) : 0;
                document.getElementById('average-score').innerText = avgScore;

                // Module Progress List
                const container = document.getElementById('module-progress-list');
                container.innerHTML = '';

                // You can expand this with actual module names later
                Object.entries(data.modules || {}).forEach(([modId, progress]) => {
                    const div = document.createElement('div');
                    div.className = `flex justify-between items-center bg-slate-800 p-4 rounded-2xl`;
                    div.innerHTML = `
                        <div>
                            <div class="font-medium">${modId}</div>
                            <div class="text-xs text-slate-400">${progress.completed || 0} words practiced</div>
                        </div>
                        <div class="text-right">
                            <div class="text-emerald-400 font-bold">${progress.score || 0}</div>
                            <div class="text-xs text-slate-400">Score</div>
                        </div>
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                console.error(err);
            }
        }

        window.onload = loadPerformance;
    </script>
</body>
</html>
