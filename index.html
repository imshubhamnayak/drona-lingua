<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drona Lingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 rounded-3xl p-10 text-center">
        <div class="mx-auto w-24 h-24 bg-orange-600 rounded-3xl flex items-center justify-center text-6xl mb-6">🗣️</div>
        <h1 class="text-4xl font-bold mb-2">Drona Lingua</h1>
        <p class="text-slate-400 mb-8">Master Sa vs Sha • Z vs G</p>

        <input id="username-input" type="text" placeholder="Enter your name" 
               class="w-full bg-slate-800 rounded-2xl px-6 py-5 text-lg mb-6">

        <button onclick="startApp()" 
                class="w-full bg-orange-600 hover:bg-orange-500 py-6 rounded-2xl text-2xl font-semibold">
            Start Learning →
        </button>
    </div>

    <script>
        function startApp() {
            const name = document.getElementById('username-input').value.trim();
            if (name) {
                localStorage.setItem('dronaUsername', name);
            }
            window.location.href = "practice.html";   // We'll create this next if needed
        }
    </script>
</body>
</html>
