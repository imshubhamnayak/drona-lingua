<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drona Lingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
        .screen { display: none; }
        .screen.active { display: block; }
        canvas { background: #1f2937; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- USERNAME SCREEN -->
    <div id="username-screen" class="screen active flex items-center justify-center min-h-screen p-6">
        <div class="max-w-md w-full bg-slate-900 rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto bg-orange-600 rounded-2xl flex items-center justify-center text-5xl mb-6">🗣️</div>
                <h1 class="text-4xl font-bold">Drona Lingua</h1>
                <p class="text-slate-400 mt-2">Master Sa vs Sha • Z vs G</p>
            </div>
            
            <input id="username-input" type="text" placeholder="Enter your name" 
                   class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-5 text-lg focus:outline-none focus:border-orange-500">
            
            <button onclick="startWithUsername()" 
                    class="w-full mt-8 bg-orange-600 hover:bg-orange-500 py-5 rounded-2xl font-semibold text-xl transition-all">
                Start Learning →
            </button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="screen min-h-screen flex flex-col">
        <header class="bg-slate-900 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-orange-600 rounded-2xl flex items-center justify-center text-2xl">🗣️</div>
                <div>
                    <div class="font-bold">Drona Lingua</div>
                    <div id="display-username" class="text-sm text-slate-400">Guest</div>
                </div>
            </div>
            <button onclick="showPerformance()" class="px-5 py-2 bg-slate-800 rounded-2xl flex items-center gap-2">
                <i class="fa-solid fa-chart-bar"></i> Progress
            </button>
        </header>

        <div class="flex-1 p-6 flex flex-col">
            <div class="text-center mb-8">
                <div id="current-word" class="text-6xl font-bold mb-2"></div>
                <div id="roman" class="text-2xl text-orange-400"></div>
            </div>
            <div id="cue" class="text-center text-slate-400 mb-8"></div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div><canvas id="correctWaveform" width="280" height="110" class="w-full rounded-2xl"></canvas></div>
                <div><canvas id="userWaveform" width="280" height="110" class="w-full rounded-2xl"></canvas></div>
            </div>

            <button id="recordBtn" onclick="toggleRecording()" 
                    class="w-full py-7 bg-orange-600 rounded-3xl text-xl font-semibold flex items-center justify-center gap-3">
                <i class="fa-solid fa-microphone"></i>
                <span>Record & Compare</span>
            </button>

            <div id="feedback" class="mt-8 text-center text-xl min-h-[60px]"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
