<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drona Lingua • UP Accent Mastery</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0f1c; color: #e2e8f0; margin: 0; padding: 0; }
    .top-bar { background: #111827; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e2937; }
    .main { max-width: 820px; margin: 0 auto; padding: 20px; }
    .card { background: #1e2937; border-radius: 20px; padding: 28px; margin-bottom: 24px; }
    .module-card { background: #1e2937; padding: 20px; border-radius: 16px; margin-bottom: 12px; cursor: pointer; }
    .module-card.locked { opacity: 0.5; cursor: not-allowed; }
    .module-card.completed { border: 2px solid #22c55e; }
    .word { font-size: 42px; font-weight: 700; margin: 12px 0; }
    .pair-container { display: flex; gap: 30px; justify-content: center; margin: 30px 0; }
    .pair-box { background: #334155; padding: 20px 30px; border-radius: 16px; text-align: center; min-width: 160px; }
    button { padding: 14px 28px; font-size: 17px; border-radius: 14px; cursor: pointer; font-weight: 600; border: none; margin: 6px; }
    .primary { background: #3b82f6; color: white; }
    .success { background: #22c55e; color: white; }
    .warning { background: #f59e0b; color: white; }
    .timer { font-size: 24px; font-weight: 600; color: #60a5fa; }
    .dashboard-btn {
      background: #334155; color: #e2e8f0; padding: 8px 16px; border-radius: 10px;
      text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;
    }
    .dashboard-btn:hover { background: #475569; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div>
      <strong id="userName">Guest</strong> • Level <span id="level">1</span>
    </div>
    <div style="display:flex; gap:20px; align-items:center;">
      <div class="timer" id="timer">00:00</div>
      <div style="color:#eab308;">XP <span id="xp">0</span></div>
      <a href="/performance.html" target="_blank" class="dashboard-btn">📊 Performance</a>
    </div>
  </div>

  <div class="main">

    <!-- Registration -->
    <div id="registerScreen" class="card">
      <h2>Welcome to Drona Lingua</h2>
      <input type="text" id="usernameInput" placeholder="Enter your name" style="width:80%; padding:14px; margin:15px 0; background:#334155; color:white; border-radius:8px; border:none;">
      <br>
      <button class="primary" onclick="registerUser()">Start Learning</button>
    </div>

    <!-- Modules -->
    <div id="modulesScreen" style="display:none;">
      <h2>Your Learning Path (20 Modules)</h2>
      <div id="modulesList"></div>
    </div>

    <!-- Practice Screen -->
    <div id="practiceScreen" style="display:none;">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 id="moduleTitle"></h3>
          <div class="timer" id="timerDisplay">00:00</div>
        </div>

        <div id="singleWordMode">
          <div class="word" id="currentWord"></div>
          <div id="roman" style="font-size:22px; color:#94a3b8; margin-bottom:25px;"></div>
        </div>

        <div id="minimalPairsMode" style="display:none;">
          <div class="pair-container">
            <div class="pair-box">
              <div class="word" id="pairWord1"></div>
              <div id="pairRoman1" style="font-size:18px; color:#94a3b8;"></div>
              <button onclick="listenPair(0)">🔊 Listen Left</button>
            </div>
            <div class="pair-box">
              <div class="word" id="pairWord2"></div>
              <div id="pairRoman2" style="font-size:18px; color:#94a3b8;"></div>
              <button onclick="listenPair(1)">🔊 Listen Right</button>
            </div>
          </div>
          <div style="text-align:center; margin-top:10px; color:#64748b;">Practice saying both clearly</div>
        </div>

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;">
          <button class="primary" onclick="listenWord()" id="listenBtn">🔊 Listen</button>
          <button class="success" onclick="markCorrect()">✅ Got it Right</button>
          <button class="warning" onclick="markIncorrect()">⚠️ Need More Practice</button>
        </div>

        <div id="feedback" style="margin-top:20px; min-height:60px;"></div>
        <button onclick="finishModule()" style="background:#64748b; margin-top:20px;">Finish Module</button>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://drona-lingua-backend.onrender.com";

    let currentUser = null;
    let currentModuleData = null;
    let timerInterval = null;
    let sessionStartTime = null;
    let moduleStartTime = null;
    let currentIndex = 0;
    let isMinimalPairs = false;

    let xp = 0;
    let level = 1;
    let completedModules = [];

    // ==================== WORDBANK ====================
    const wordBank = [
      // Hindi SA
      { hindi: "सही", roman: "Sahi", tip: "Soft dental 'Sa'" },
      { hindi: "सरकार", roman: "Sarkar", tip: "Soft 'Sa'" },
      { hindi: "सामान", roman: "Samaan", tip: "Soft 'Sa'" },
      { hindi: "सड़क", roman: "Sadak", tip: "Soft 'Sa'" },
      { hindi: "सफल", roman: "Safal", tip: "Soft 'Sa'" },

      // Hindi SHA
      { hindi: "शहर", roman: "Shahar", tip: "Strong 'Sha'" },
      { hindi: "शेर", roman: "Sher", tip: "Strong 'Sha'" },
      { hindi: "शाम", roman: "Shaam", tip: "Strong 'Sha'" },
      { hindi: "शुरू", roman: "Shuru", tip: "Strong 'Sha'" },
      { hindi: "शक्ति", roman: "Shakti", tip: "Strong 'Sha'" },

      // English Words
      { hindi: "Station", roman: "Station", tip: "S-TAY-shun" },
      { hindi: "Attention", roman: "Attention", tip: "uh-TEN-shun" },
      { hindi: "Special", roman: "Special", tip: "SPE-shul" },
      { hindi: "Information", roman: "Information", tip: "in-for-MAY-shun" },
      { hindi: "Education", roman: "Education", tip: "ed-yoo-KAY-shun" },
      { hindi: "Nation", roman: "Nation", tip: "NAY-shun" },
      { hindi: "Action", roman: "Action", tip: "AK-shun" },
      { hindi: "Mention", roman: "Mention", tip: "MEN-shun" },
      { hindi: "Sugar", roman: "Sugar", tip: "SHOO-gar" },
      { hindi: "Sure", roman: "Sure", tip: "SHOOR" },
      { hindi: "Shirt", roman: "Shirt", tip: "Strong 'Sh'" },
      { hindi: "Shoes", roman: "Shoes", tip: "Strong 'Sh'" },

      // Sentences
      { hindi: "Go to the station on time", roman: "Go to the station on time", tip: "Real life" },
      { hindi: "Pay attention in class", roman: "Pay attention in class", tip: "School context" },
      { hindi: "शहर में सही सामान है", roman: "Shahar mein sahi samaan hai", tip: "Mixed" }
    ];

    // ==================== 20 MODULES ====================
    const modules = [
      { id: 1, title: "Module 1: Pure 'Sa' Sound (स)", type: "single", words: [0,1,2,3,4] },
      { id: 2, title: "Module 2: Pure 'Sha' Sound (श)", type: "single", words: [5,6,7,8,9] },
      { id: 3, title: "Module 3: Minimal Pairs Drill", type: "minimal_pairs", pairs: [[0,5], [1,6], [2,7]] },
      { id: 4, title: "Module 4: English Words - Station & Attention", type: "single", words: [10,11] },
      { id: 5, title: "Module 5: English Words - Special, Sugar, Sure", type: "single", words: [12,18,19] },
      { id: 6, title: "Module 6: More English Practice", type: "single", words: [13,14,15,16,17] },
      { id: 7, title: "Module 7: Real Life Sentences", type: "single", words: [20,21,22] },
      { id: 8, title: "Module 8: Minimal Pairs + English", type: "minimal_pairs", pairs: [[0,5], [10,11]] },
      { id: 9, title: "Module 9: Sales Context", type: "single", words: [0,1,4,5] },
      { id: 10, title: "Module 10: Mixed Review", type: "single", words: [0,5,10,11,12] },
      { id: 11, title: "Module 11: Long Sentences", type: "single", words: [20,21,22] },
      { id: 12, title: "Module 12: Speed Round", type: "single", words: [0,5,10,11,12] },
      { id: 13, title: "Module 13: Hindi Heavy Review", type: "single", words: [0,1,2,3,4] },
      { id: 14, title: "Module 14: English Heavy Review", type: "single", words: [10,11,12,13,14,15] },
      { id: 15, title: "Module 15: Minimal Pairs Challenge", type: "minimal_pairs", pairs: [[0,5], [10,11], [18,19]] },
      { id: 16, title: "Module 16: Complex Sentences", type: "single", words: [20,21,22] },
      { id: 17, title: "Module 17: High Speed Mixed", type: "single", words: [0,5,10,11,12] },
      { id: 18, title: "Module 18: Long Practice", type: "single", words: [20,21,22] },
      { id: 19, title: "Module 19: Full Review Round", type: "single", words: [0,5,10,11,12,18] },
      { id: 20, title: "Module 20: Final Mastery Challenge", type: "single", words: [10,11,12,13,14,15,18] }
    ];

    // ==================== ENTER KEY SUPPORT ====================
    function setupEnterKey() {
      const input = document.getElementById("usernameInput");
      if (input) {
        input.addEventListener("keypress", function(e) {
          if (e.key === "Enter") {
            registerUser();
          }
        });
      }
    }

    // ==================== TIMER ====================
    function startSessionTimer() {
      if (sessionStartTime === null) sessionStartTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
        const min = Math.floor(elapsed / 60);
        const sec = elapsed % 60;
        document.getElementById("timer").textContent = 
          `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
      }, 1000);
    }

    // ==================== START MODULE (Fixed) ====================
    function startModule(module) {
      currentModuleData = module;
      isMinimalPairs = module.type === "minimal_pairs";
      currentIndex = 0;                    // ← Important fix
      moduleStartTime = Date.now();

      document.getElementById("modulesScreen").style.display = "none";
      document.getElementById("practiceScreen").style.display = "block";
      document.getElementById("moduleTitle").textContent = module.title;

      if (sessionStartTime === null) startSessionTimer();

      if (isMinimalPairs) {
        document.getElementById("singleWordMode").style.display = "none";
        document.getElementById("minimalPairsMode").style.display = "block";
        document.getElementById("listenBtn").style.display = "none";
        loadMinimalPair();
      } else {
        document.getElementById("singleWordMode").style.display = "block";
        document.getElementById("minimalPairsMode").style.display = "none";
        document.getElementById("listenBtn").style.display = "inline-block";
        loadWordFromModule();
      }
    }

    // ==================== FINISH MODULE ====================
    function finishModule() {
      const endTime = Date.now();
      const timeTakenSeconds = Math.floor((endTime - moduleStartTime) / 1000);

      if (currentModuleData && currentUser) {
        fetch(`${API_URL}/api/complete_module/${currentUser}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            module_id: currentModuleData.id,
            time_taken: timeTakenSeconds
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            xp = data.xp;
            level = data.level;
            completedModules = data.completed_modules || [];
          }
          // Always update UI even if backend fails
          document.getElementById("practiceScreen").style.display = "none";
          document.getElementById("modulesScreen").style.display = "block";
          loadModules();
          updateUI();
        })
        .catch(() => {
          document.getElementById("practiceScreen").style.display = "none";
          document.getElementById("modulesScreen").style.display = "block";
          loadModules();
          updateUI();
        });
      } else {
        document.getElementById("practiceScreen").style.display = "none";
        document.getElementById("modulesScreen").style.display = "block";
        loadModules();
        updateUI();
      }
    }

    // ==================== LOAD MODULES ====================
    function loadModules() {
      const container = document.getElementById("modulesList");
      container.innerHTML = "";

      modules.forEach((mod, index) => {
        const isCompleted = completedModules.includes(mod.id);
        const isLocked = index > 0 && !completedModules.includes(modules[index - 1].id);

        const div = document.createElement("div");
        div.className = `module-card ${isCompleted ? 'completed' : ''} ${isLocked ? 'locked' : ''}`;
        
        let badge = mod.type === "minimal_pairs" ? " <span style='color:#a78bfa'>[Minimal Pairs]</span>" : "";

        div.innerHTML = `
          <strong>Module ${mod.id}: ${mod.title}</strong>${badge}<br>
          ${isCompleted ? '<span style="color:#22c55e">✓ Completed</span>' : ''}
          ${isLocked ? '<span style="color:#ef4444">🔒 Locked</span>' : ''}
        `;

        if (!isLocked) {
          div.onclick = () => startModule(mod);
        }
        container.appendChild(div);
      });
    }

    // ==================== REGISTER ====================
    async function registerUser() {
      const username = document.getElementById("usernameInput").value.trim();
      if (!username) return alert("Please enter your name");

      const res = await fetch(`${API_URL}/api/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
      });
      const result = await res.json();
      if (result.status === "success") {
        currentUser = username;
        document.getElementById("registerScreen").style.display = "none";
        document.getElementById("modulesScreen").style.display = "block";
        document.getElementById("userName").textContent = username;
        loadModules();
      }
    }

    // ==================== LOAD CONTENT ====================
    function loadWordFromModule() {
      const wordIndex = currentModuleData.words[currentIndex];
      const q = wordBank[wordIndex];
      document.getElementById("currentWord").textContent = q.hindi;
      document.getElementById("roman").textContent = `${q.roman} — ${q.tip}`;
    }

    function loadMinimalPair() {
      const pair = currentModuleData.pairs[currentIndex];
      const w1 = wordBank[pair[0]];
      const w2 = wordBank[pair[1]];
      document.getElementById("pairWord1").textContent = w1.hindi;
      document.getElementById("pairRoman1").textContent = w1.roman;
      document.getElementById("pairWord2").textContent = w2.hindi;
      document.getElementById("pairRoman2").textContent = w2.roman;
    }

    // ==================== LISTEN ====================
    function listenPair(side) {
      const pair = currentModuleData.pairs[currentIndex];
      const idx = side === 0 ? pair[0] : pair[1];
      const utterance = new SpeechSynthesisUtterance(wordBank[idx].hindi);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    }

    function listenWord() {
      const wordIndex = currentModuleData.words[currentIndex];
      const utterance = new SpeechSynthesisUtterance(wordBank[wordIndex].hindi);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    }

    // ==================== MARK & NEXT ====================
    function markCorrect() {
      xp += 40;
      updateUI();
      nextItem();
    }

    function markIncorrect() {
      xp += 15;
      updateUI();
      nextItem();
    }

    function nextItem() {
      currentIndex++;
      const total = isMinimalPairs ? currentModuleData.pairs.length : currentModuleData.words.length;

      if (currentIndex < total) {
        if (isMinimalPairs) {
          loadMinimalPair();
        } else {
          loadWordFromModule();
        }
      } else {
        finishModule();
      }
    }

    function updateUI() {
      document.getElementById("xp").textContent = xp;
      document.getElementById("level").textContent = level;
    }

    // ==================== INIT ====================
    function init() {
      setupEnterKey();
    }

    init();
  </script>
</body>
</html>
