<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drona Lingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .section-card {
            transition: all 0.2s ease;
        }
        .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .sound-tab {
            transition: all 0.2s ease;
        }
        .sound-tab.active {
            background-color: #1e2937;
            color: white;
            border-bottom: 3px solid #f97316;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-orange-600 rounded-2xl flex items-center justify-center">
                    <span class="font-bold text-white text-2xl">DL</span>
                </div>
                <div>
                    <span class="font-semibold text-2xl">Drona Lingua</span>
                </div>
            </div>
            
            <div class="flex items-center gap-x-4">
                <div class="flex items-center gap-x-2 bg-slate-800 px-4 py-1.5 rounded-2xl">
                    <i class="fa-solid fa-fire text-orange-400"></i>
                    <span class="font-medium">12 day streak</span>
                </div>
                <div class="w-9 h-9 bg-slate-700 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-8">
        
        <!-- Welcome -->
        <div class="mb-8">
            <h1 class="text-4xl font-semibold">Master your English sounds</h1>
            <p class="text-slate-400 mt-2">Fix the sounds that hold you back in interviews and meetings.</p>
        </div>

        <!-- Sound Pair Selection -->
        <div class="mb-6">
            <div class="flex gap-3">
                <button onclick="selectSoundPair('s-sh')" 
                        class="sound-tab active px-6 py-3 rounded-2xl flex items-center gap-x-2 bg-slate-800 border border-slate-700">
                    <span class="font-semibold">S vs SH</span>
                </button>
                <button onclick="selectSoundPair('z-g')" 
                        class="sound-tab px-6 py-3 rounded-2xl flex items-center gap-x-2 bg-slate-800 border border-slate-700">
                    <span class="font-semibold">Z vs G</span>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content">
            <!-- Content will be loaded here via JS -->
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
