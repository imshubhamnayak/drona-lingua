<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drona Lingua • UP Accent Mastery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div>
      <strong id="userName">Guest</strong> • Level <span id="level">1</span>
    </div>
    <div style="display:flex; gap:20px; align-items:center;">
      <div class="timer" id="timer">00:00</div>
      <div style="color:#eab308;">XP <span id="xp">0</span></div>
      <a href="performance.html" target="_blank" class="dashboard-btn">📊 Performance</a>
    </div>
  </div>

  <div class="main">

    <!-- Registration -->
    <div id="registerScreen" class="card">
      <h2>Welcome to Drona Lingua</h2>
      <input type="text" id="usernameInput" placeholder="Enter your name">
      <br>
      <button class="primary" onclick="registerUser()">Start Learning</button>
    </div>

    <!-- Modules -->
    <div id="modulesScreen" style="display:none;">
      <h2>Your Learning Path (20 Modules)</h2>
      <div id="modulesList"></div>
    </div>

    <!-- Practice Screen -->
    <div id="practiceScreen" style="display:none;">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 id="moduleTitle"></h3>
          <div class="timer" id="timerDisplay">00:00</div>
        </div>

        <!-- Single Word Mode -->
        <div id="singleWordMode">
          <div class="word" id="currentWord"></div>
          <div id="roman" style="font-size:22px; color:#94a3b8; margin-bottom:25px;"></div>
        </div>

        <!-- Minimal Pairs Mode -->
        <div id="minimalPairsMode" style="display:none;">
          <div class="pair-container">
            <div class="pair-box">
              <div class="word" id="pairWord1"></div>
              <div id="pairRoman1" style="font-size:18px; color:#94a3b8;"></div>
              <button onclick="listenPair(0)">🔊 Listen Left</button>
            </div>
            <div class="pair-box">
              <div class="word" id="pairWord2"></div>
              <div id="pairRoman2" style="font-size:18px; color:#94a3b8;"></div>
              <button onclick="listenPair(1)">🔊 Listen Right</button>
            </div>
          </div>
          <div style="text-align:center; margin-top:10px; color:#64748b;">Practice saying both clearly</div>
        </div>

        <!-- Tongue Position -->
        <div id="tonguePositionBox" class="tongue-box" style="display: none; margin-top: 25px;">
          <div style="display: flex; align-items: center; gap: 15px;">
            <div id="tongueImage" style="width: 90px; height: 90px; background: #475569; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; padding: 8px; flex-shrink: 0;"></div>
            <div>
              <strong id="tongueTitle"></strong>
              <p id="tongueTip" style="margin: 6px 0 0 0; font-size: 14px; color: #cbd5e1;"></p>
            </div>
          </div>
        </div>

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;">
          <button class="primary" onclick="listenWord()" id="listenBtn">🔊 Listen</button>
          <button class="success" onclick="markCorrect()">✅ Got it Right</button>
          <button class="warning" onclick="markIncorrect()">⚠️ Need More Practice</button>
        </div>

        <div id="feedback" style="margin-top:20px; min-height:60px;"></div>
        <button onclick="finishModule()" style="background:#64748b; margin-top:20px;">Finish Module</button>
      </div>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
