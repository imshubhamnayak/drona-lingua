<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drona Lingua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- Username Screen -->
    <div id="username-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full">
            <div class="text-center mb-12">
                <div class="text-6xl mb-4">🗣️</div>
                <h1 class="text-4xl font-bold">Drona Lingua</h1>
                <p class="text-slate-400 mt-2">Master your pronunciation</p>
            </div>
            
            <div class="bg-slate-900 rounded-3xl p-8">
                <h2 class="text-xl font-semibold mb-6 text-center">Enter Your Name</h2>
                <input type="text" id="username-input" placeholder="Your Name" 
                       class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4 text-lg text-center focus:outline-none">
                <button onclick="startWithUsername()" 
                        class="w-full mt-6 py-4 bg-orange-600 hover:bg-orange-500 rounded-2xl font-semibold text-lg">
                    Start Training →
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="main-app" class="hidden min-h-screen">
        <!-- Header -->
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🗣️</span>
                <div>
                    <div class="font-semibold" id="display-username">User</div>
                    <div class="text-xs text-emerald-400">Level <span id="display-level">1</span></div>
                </div>
            </div>
            <button onclick="showPerformance()" class="px-5 py-2 bg-slate-800 rounded-2xl text-sm flex items-center gap-2">
                <i class="fa-solid fa-chart-bar"></i> Progress
            </button>
        </div>

        <div class="p-4">
            <h2 class="text-2xl font-semibold mb-6">Choose Module</h2>
            
            <div class="grid grid-cols-2 gap-4" id="modules-grid">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
